[project]
name = "sleeping-beauty-gateway"
version = "0.2.0"
description = "Local RAG + Memory gateway for llama.cpp"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
