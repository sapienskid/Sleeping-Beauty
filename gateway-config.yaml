# Sleeping Beauty — Gateway Configuration
# Phase 1: proxy-only (no RAG yet)

gateway:
  host: "0.0.0.0"
  port: 8800
  workers: 1
  log_level: "info"

llama_chat:
  # From inside Docker, host.docker.internal resolves to the host machine
  # where llama-server runs via systemd
  base_url: "http://host.docker.internal:8080"

llama_embed:
  backend: "sentence-transformers"
  model: "all-MiniLM-L6-v2"

chroma:
  host: "chroma"
  port: 8000

retrieval:
  top_k: 5
  confidence_threshold: 0.35
  collections:
    - "project-docs"
  max_context_tokens: 3000

ingestion:
  chunk_size: 512
  chunk_overlap: 64

memory:
  enabled: true
  collection: "user-memory"
