name: sleeping-beauty-ai

services:
  open-webui:
    image: openwebui/open-webui:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - qdrant
      - docling
      - embeddings
      - edge-tts
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      # Core
      WEBUI_NAME: "${WEBUI_NAME:-Sleeping Beauty Local AI}"
      ENABLE_OLLAMA_API: "${ENABLE_OLLAMA_API:-False}"
      ENABLE_OPENAI_API: "${ENABLE_OPENAI_API:-True}"
      OPENAI_API_BASE_URLS: "${OPENAI_API_BASE_URLS:-http://host.docker.internal:10000/v1}"
      OPENAI_API_KEYS: "${OPENAI_API_KEYS:-sk-local}"
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-http://host.docker.internal:10000/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-sk-local}"
      # Document extraction
      CONTENT_EXTRACTION_ENGINE: "${CONTENT_EXTRACTION_ENGINE:-docling}"
      DOCLING_SERVER_URL: "${DOCLING_SERVER_URL:-http://docling:5001}"
      # Vector DB (Qdrant only)
      VECTOR_DB: "${VECTOR_DB:-qdrant}"
      QDRANT_URI: "${QDRANT_URI:-http://qdrant:6333}"
      QDRANT_ON_DISK: "${QDRANT_ON_DISK:-true}"
      QDRANT_PREFER_GRPC: "${QDRANT_PREFER_GRPC:-true}"
      QDRANT_GRPC_PORT: "${QDRANT_GRPC_PORT:-6334}"
      QDRANT_HNSW_M: "${QDRANT_HNSW_M:-16}"
      QDRANT_COLLECTION_PREFIX: "${QDRANT_COLLECTION_PREFIX:-sleeping-beauty}"
      # Embeddings
      RAG_EMBEDDING_ENGINE: "${RAG_EMBEDDING_ENGINE:-openai}"
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      RAG_EMBEDDING_BATCH_SIZE: "${RAG_EMBEDDING_BATCH_SIZE:-8}"
      RAG_EMBEDDING_QUERY_PREFIX: "${RAG_EMBEDDING_QUERY_PREFIX:-}"
      RAG_OPENAI_API_BASE_URL: "${RAG_OPENAI_API_BASE_URL:-http://embeddings:80/v1}"
      RAG_OPENAI_API_KEY: "${RAG_OPENAI_API_KEY:-not-needed}"
      # RAG retrieval
      ENABLE_RAG_HYBRID_SEARCH: "${ENABLE_RAG_HYBRID_SEARCH:-true}"
      RAG_HYBRID_BM25_WEIGHT: "${RAG_HYBRID_BM25_WEIGHT:-0.30}"
      RAG_TOP_K: "${RAG_TOP_K:-6}"
      RAG_RELEVANCE_THRESHOLD: "${RAG_RELEVANCE_THRESHOLD:-0.15}"
      CHUNK_SIZE: "${CHUNK_SIZE:-800}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-150}"
      ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER: "${ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER:-true}"
      ENABLE_RAG_LOCAL_WEB_FETCH: "${ENABLE_RAG_LOCAL_WEB_FETCH:-true}"
      # Text-to-Speech (OpenAI Edge TTS)
      AUDIO_TTS_ENGINE: "${AUDIO_TTS_ENGINE:-openai}"
      AUDIO_TTS_MODEL: "${AUDIO_TTS_MODEL:-tts-1}"
      AUDIO_TTS_VOICE: "${AUDIO_TTS_VOICE:-en-US-AndrewNeural}"
      AUDIO_TTS_OPENAI_API_BASE_URL: "${AUDIO_TTS_OPENAI_API_BASE_URL:-http://edge-tts:5050/v1}"
      AUDIO_TTS_OPENAI_API_KEY: "${AUDIO_TTS_OPENAI_API_KEY:-sk-edge-tts}"
      # Speech-to-Text (built-in Whisper)
      AUDIO_STT_ENGINE: "${AUDIO_STT_ENGINE:-}"
      WHISPER_MODEL: "${WHISPER_MODEL:-base}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-en}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai_net

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_net

  docling:
    image: "${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve:latest}"
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "${DOCLING_SERVE_ENABLE_UI:-true}"
      DOCLING_SERVE_MAX_SYNC_WAIT: "${DOCLING_SERVE_MAX_SYNC_WAIT:-600}"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "${DOCLING_SERVE_ENG_LOC_NUM_WORKERS:-2}"
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "${DOCLING_SERVE_ENG_LOC_SHARE_MODELS:-true}"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "${DOCLING_SERVE_LOAD_MODELS_AT_BOOT:-true}"
      DOCLING_NUM_THREADS: "${DOCLING_NUM_THREADS:-6}"
      DOCLING_PERF_PAGE_BATCH_SIZE: "${DOCLING_PERF_PAGE_BATCH_SIZE:-4}"
    volumes:
      - docling_data:/opt/app-root/src/.cache/docling
    networks:
      - ai_net

  edge-tts:
    image: travisvn/openai-edge-tts:latest
    restart: unless-stopped
    ports:
      - "${EDGE_TTS_PORT:-5050}:5050"
    environment:
      API_KEY: "${EDGE_TTS_API_KEY:-sk-edge-tts}"
      REQUIRE_API_KEY: "${EDGE_TTS_REQUIRE_API_KEY:-true}"
      DEFAULT_VOICE: "${EDGE_TTS_DEFAULT_VOICE:-en-US-AndrewNeural}"
      DEFAULT_LANGUAGE: "${EDGE_TTS_DEFAULT_LANGUAGE:-en-US}"
    networks:
      - ai_net

  embeddings:
    image: "${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}"
    restart: unless-stopped
    ports:
      - "${EMBEDDING_PORT:-8081}:80"
    gpus: all
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    command:
      - "--model-id"
      - "${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}"
      - "--dtype"
      - "${EMBEDDING_DTYPE:-float16}"
      - "--max-batch-tokens"
      - "${EMBEDDING_MAX_BATCH_TOKENS:-2048}"
      - "--max-concurrent-requests"
      - "${EMBEDDING_MAX_CONCURRENT_REQUESTS:-4}"
      - "--auto-truncate"
    volumes:
      - embedding_cache:/data
    networks:
      - ai_net

volumes:
  open_webui_data:
  qdrant_data:
  docling_data:
  embedding_cache:

networks:
  ai_net:
    driver: bridge
