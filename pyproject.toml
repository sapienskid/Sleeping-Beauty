[project]
name = "sleeping-beauty"
version = "0.2.0"
description = "High-performance local knowledge search & RAG engine powered by EmbeddingGemma-2, LanceDB, and 1-2B micro LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "lancedb>=0.17.0",
    "tantivy>=0.22.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pymupdf>=1.24.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "sentence-transformers>=3.0.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
    "torchvision",
]

[project.scripts]
sb = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
