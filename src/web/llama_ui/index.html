					<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
					<span id="sb-vault-label">All Sources</span>
					<svg class="sb-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
				</button>
				<div id="sb-vault-menu" class="sb-dropdown-menu">
					<div class="sb-dropdown-item selected" data-vault="all">
						<span style="display: flex; align-items: center; gap: 6px;">
							<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
							All Vaults
						</span>
						<span class="sb-total-chunks-badge" style="color: #71717a; font-size: 11px;">(4,138 chunks)</span>
					</div>
					<div id="sb-vault-items"></div>
				</div>
			</div>

			<button id="sb-manage-btn" class="sb-btn" type="button" title="Manage Indexed Vaults & Knowledge Sources">
				<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
				<span>Sources</span>
			</button>
		</div>

		<!-- Slide-Over Drawer -->
		<div id="sb-drawer-backdrop"></div>
		<div id="sb-drawer">
			<div class="sb-drawer-header">
				<h2>
					<svg class="sb-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
					<span>Knowledge Vaults & Sources</span>
				</h2>
				<button id="sb-drawer-close" class="sb-close-btn">
					<svg class="sb-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
				</button>
			</div>

			<div class="sb-drawer-body">
				<div>
					<div class="sb-section-title">
						<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
						Active Knowledge Vaults
					</div>
					<div id="sb-vault-list">
						<!-- Vault cards rendered dynamically -->
					</div>
				</div>

				<div>
					<div class="sb-section-title">
						<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
						Index New Vault or Folder
					</div>
					<div style="display: flex; flex-direction: column; gap: 8px;">
						<input type="text" id="sb-new-vault-path" class="sb-input" placeholder="e.g. /home/sapiens/Development/Fundaments/handbook" />
						<button id="sb-index-btn" class="sb-primary-btn" type="button">
							<svg class="sb-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
							<span>Scan &amp; Index Vault</span>
						</button>
						<div id="sb-index-status" style="font-size: 12px; display: none;"></div>
					</div>
				</div>

				<div>
					<div class="sb-section-title">
						<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
						RAG Retrieval Parameters
					</div>
					<div style="background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 14px;">
						<div style="display: flex; align-items: center; justify-content: space-between;">
							<span style="font-size: 13px;">Top-K Chunks: <strong id="sb-topk-value" style="color: #34d399;">4</strong></span>
							<input type="range" id="sb-topk-slider" min="1" max="10" value="4" style="width: 130px; accent-color: #10b981;" />
						</div>
						<div style="display: flex; align-items: center; justify-content: space-between;">
							<span style="font-size: 13px;">Grounding Citations</span>
							<label class="sb-toggle-switch">
								<input type="checkbox" id="sb-citations-toggle" checked />
								<span class="sb-slider"></span>
							</label>
						</div>
					</div>
				</div>

				<div>
					<div class="sb-section-title">
						<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
						Test Search Engine
					</div>
					<div style="background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 14px;">
						<input type="text" id="sb-test-search-input" class="sb-input" placeholder="Type query to test LanceDB hybrid retrieval..." />
						<div id="sb-test-search-results" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px;"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- Controller & Transparent Fetch Interceptor -->
		<script>
			(function() {
				const SVG_FOLDER = '<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
				const SVG_TRASH = '<svg class="sb-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

				const STORAGE_KEY = 'sb.rag.config';

				function loadSavedRagState() {
					try {
						const raw = localStorage.getItem(STORAGE_KEY);
						if (!raw) return {};
						const parsed = JSON.parse(raw);
						return parsed && typeof parsed === 'object' ? parsed : {};
					} catch (e) {
						return {};
					}
				}

				function saveRagState() {
					try {
						localStorage.setItem(STORAGE_KEY, JSON.stringify({
							enabled: window.__RAG_CONFIG__.enabled,
							selected_vault: window.__RAG_CONFIG__.selected_vault,
							disabled_vaults: Array.from(window.__RAG_CONFIG__.disabled_vaults),
							top_k: window.__RAG_CONFIG__.top_k,
							include_sources: window.__RAG_CONFIG__.include_sources
						}));
					} catch (e) {}
				}

				const savedState = loadSavedRagState();

				// Global RAG State
				window.__RAG_CONFIG__ = {
					enabled: typeof savedState.enabled === 'boolean' ? savedState.enabled : true,
					selected_vault: typeof savedState.selected_vault === 'string' ? savedState.selected_vault : 'all',
					disabled_vaults: new Set(Array.isArray(savedState.disabled_vaults) ? savedState.disabled_vaults : []),
					top_k: typeof savedState.top_k === 'number' ? savedState.top_k : 4,
					include_sources: typeof savedState.include_sources === 'boolean' ? savedState.include_sources : true,
					vaults_data: []
				};

				// Intercept Fetch for chat completions
				const originalFetch = window.fetch.bind(window);
				window.fetch = async function(...args) {
					let [resource, config] = args;
					let url = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');

					if (url.includes('chat/completions') && !url.includes('completions/control') && config && config.body && typeof config.body === 'string') {
						try {
							const body = JSON.parse(config.body);
							body.rag_enabled = window.__RAG_CONFIG__.enabled;
							body.selected_vault = window.__RAG_CONFIG__.selected_vault;
							body.disabled_vaults = Array.from(window.__RAG_CONFIG__.disabled_vaults);
							body.top_k = window.__RAG_CONFIG__.top_k;
							body.include_sources = window.__RAG_CONFIG__.include_sources;
							delete body.tools;
							delete body.tool_choice;
							config.body = JSON.stringify(body);
						} catch (e) {
							console.warn('[Sleeping Beauty RAG] Error augmenting body:', e);
						}
					}
					return originalFetch.apply(window, args);
				};

				// Top Toolbar Elements
				const toggleBtn = document.getElementById('sb-rag-toggle');
				const toggleDot = document.getElementById('sb-rag-dot');
				const toggleLabel = document.getElementById('sb-rag-label');
				const vaultBtn = document.getElementById('sb-vault-btn');
				const vaultLabel = document.getElementById('sb-vault-label');
				const vaultMenu = document.getElementById('sb-vault-menu');
				const vaultItems = document.getElementById('sb-vault-items');
				const manageBtn = document.getElementById('sb-manage-btn');

				// Drawer Elements
				const drawer = document.getElementById('sb-drawer');
				const drawerBackdrop = document.getElementById('sb-drawer-backdrop');
				const drawerClose = document.getElementById('sb-drawer-close');
				const vaultList = document.getElementById('sb-vault-list');
				const indexBtn = document.getElementById('sb-index-btn');
				const newVaultPath = document.getElementById('sb-new-vault-path');
				const indexStatus = document.getElementById('sb-index-status');
				const topkSlider = document.getElementById('sb-topk-slider');
				const topkVal = document.getElementById('sb-topk-value');
				const citationsToggle = document.getElementById('sb-citations-toggle');
				const testSearchInput = document.getElementById('sb-test-search-input');
				const testSearchResults = document.getElementById('sb-test-search-results');

				function updateRAGUI() {
					const isEnabled = window.__RAG_CONFIG__.enabled;
					toggleBtn.className = isEnabled ? 'sb-btn sb-btn-active' : 'sb-btn sb-btn-off';
					toggleDot.className = isEnabled ? 'sb-dot sb-dot-active' : 'sb-dot';
					toggleLabel.textContent = isEnabled ? 'RAG: ON' : 'RAG: OFF';
				}

				function selectVault(vName) {
					window.__RAG_CONFIG__.selected_vault = vName;
					vaultLabel.textContent = vName === 'all' ? 'All Sources' : vName;
					document.querySelectorAll('.sb-dropdown-item').forEach(el => {
						if (el.getAttribute('data-vault') === vName) el.classList.add('selected');
						else el.classList.remove('selected');
					});
				}

				function openDrawer() {
					drawer.classList.add('open');
					drawerBackdrop.classList.add('open');
					loadVaultStats();
				}

				function closeDrawer() {
					drawer.classList.remove('open');
					drawerBackdrop.classList.remove('open');
				}

				toggleBtn.addEventListener('click', () => {
					window.__RAG_CONFIG__.enabled = !window.__RAG_CONFIG__.enabled;
					saveRagState();
					updateRAGUI();
				});

				vaultBtn.addEventListener('click', (e) => {
					e.stopPropagation();
					vaultMenu.classList.toggle('show');
				});

				manageBtn.addEventListener('click', openDrawer);
				drawerClose.addEventListener('click', closeDrawer);
				drawerBackdrop.addEventListener('click', closeDrawer);
				document.addEventListener('click', () => {
					if (vaultMenu) vaultMenu.classList.remove('show');
				});

				// Fetch Vault Stats
				async function loadVaultStats() {
					try {
						const res = await originalFetch('/api/stats');
						const data = await res.json();
						window.__RAG_CONFIG__.vaults_data = data.vaults || [];
						renderVaults(data);
					} catch (e) {
						console.error('[Sleeping Beauty] Failed to load stats:', e);
					}
				}

				function renderVaults(data) {
					document.querySelectorAll('.sb-total-chunks-badge').forEach(b => {
						b.textContent = `(${data.total_chunks.toLocaleString()} chunks)`;
					});

					if (vaultItems) {
						vaultItems.innerHTML = '';
						data.vaults.forEach(v => {
							const item = document.createElement('div');
							const isSel = window.__RAG_CONFIG__.selected_vault === v.vault_name;
							item.className = 'sb-dropdown-item' + (isSel ? ' selected' : '');
							item.setAttribute('data-vault', v.vault_name);
							item.innerHTML = `<span style="display:flex; align-items:center; gap:6px;">${SVG_FOLDER} ${v.vault_name}</span><span style="color: #71717a; font-size: 11px;">(${v.total_chunks} chunks)</span>`;
							item.onclick = (e) => {
								e.stopPropagation();
								selectVault(v.vault_name);
								saveRagState();
								vaultMenu.classList.remove('show');
							};
							vaultItems.appendChild(item);
						});
					}

					const allItem = vaultMenu.querySelector('[data-vault="all"]');
					if (allItem) {
						allItem.onclick = (e) => {
							e.stopPropagation();
							selectVault('all');
							saveRagState();
							vaultMenu.classList.remove('show');
						};
					}

					if (!data.vaults || data.vaults.length === 0) {
						vaultList.innerHTML = '<div style="color: #71717a; font-size: 13px;">No vaults indexed yet. Add one below.</div>';
						return;
					}

					vaultList.innerHTML = '';
					data.vaults.forEach(v => {
						const card = document.createElement('div');
						card.className = 'sb-vault-card';

						const isEnabled = !window.__RAG_CONFIG__.disabled_vaults.has(v.vault_name);
						const sample = (v.sample_files || []).slice(0, 3).join(', ');

						card.innerHTML = `
							<div class="sb-vault-card-header">
								<div class="sb-vault-name">
									${SVG_FOLDER}
									<span>${v.vault_name}</span>
								</div>
								<div class="sb-vault-actions">
									<label class="sb-toggle-switch" title="Enable or Disable this vault from RAG retrieval">
										<input type="checkbox" class="sb-vault-toggle" data-vault="${v.vault_name}" ${isEnabled ? 'checked' : ''} />
										<span class="sb-slider"></span>
									</label>
									<button class="sb-icon-btn sb-delete-vault-btn" data-vault="${v.vault_name}" title="Delete this vault">
										${SVG_TRASH}
									</button>
								</div>
							</div>
							<div class="sb-vault-stats">
								${v.total_documents} documents &bull; ${v.total_chunks.toLocaleString()} chunks
							</div>
							<div class="sb-vault-files" title="${sample}">
								${sample || 'Indexed documents'}
							</div>
						`;

						const toggleInput = card.querySelector('.sb-vault-toggle');
						toggleInput.addEventListener('change', (e) => {
							if (e.target.checked) window.__RAG_CONFIG__.disabled_vaults.delete(v.vault_name);
							else window.__RAG_CONFIG__.disabled_vaults.add(v.vault_name);
							saveRagState();
						});

						const delBtn = card.querySelector('.sb-delete-vault-btn');
						delBtn.addEventListener('click', async () => {
							if (confirm(`Remove vault "${v.vault_name}" from index?`)) {
								try {
									const res = await originalFetch(`/api/vaults/${encodeURIComponent(v.vault_name)}`, { method: 'DELETE' });
									if (res.ok) loadVaultStats();
								} catch (err) {
									alert('Failed to delete vault: ' + err.message);
								}
							}
						});

						vaultList.appendChild(card);
					});
				}

				// Index New Vault
				indexBtn.addEventListener('click', async () => {
					const path = newVaultPath.value.trim();
					if (!path) return;

					indexBtn.disabled = true;
					indexBtn.textContent = 'Scanning & Indexing...';
					indexStatus.style.display = 'block';
					indexStatus.style.color = '#34d399';
					indexStatus.textContent = 'Processing files and embedding chunks...';

					try {
						const res = await originalFetch('/api/index', {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({ vault_path: path })
						});
						const resData = await res.json();
						if (res.ok) {
							indexStatus.textContent = `Indexed ${resData.chunks_indexed} chunks from ${resData.files_scanned} files in ${resData.vault_name}!`;
							newVaultPath.value = '';
							loadVaultStats();
						} else {
							indexStatus.style.color = '#ef4444';
							indexStatus.textContent = resData.detail || 'Indexing failed';
						}
					} catch (e) {
						indexStatus.style.color = '#ef4444';
						indexStatus.textContent = 'Error: ' + e.message;
					} finally {
						indexBtn.disabled = false;
						indexBtn.innerHTML = '<svg class="sb-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg> <span>Scan &amp; Index Vault</span>';
					}
				});

				topkSlider.addEventListener('input', (e) => {
					const val = parseInt(e.target.value);
					topkVal.textContent = val;
					window.__RAG_CONFIG__.top_k = val;
					saveRagState();
				});

				citationsToggle.addEventListener('change', (e) => {
					window.__RAG_CONFIG__.include_sources = e.target.checked;
					saveRagState();
				});

				// Test Search
				let searchTimeout = null;
				testSearchInput.addEventListener('input', (e) => {
					clearTimeout(searchTimeout);
					const q = e.target.value.trim();
					if (!q) {
						testSearchResults.innerHTML = '';
						return;
					}
					searchTimeout = setTimeout(async () => {
						try {
							const res = await originalFetch('/api/search', {
								method: 'POST',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify({ query: q, top_k: 3 })
							});
							const data = await res.json();
							testSearchResults.innerHTML = '';
							(data.results || []).forEach(r => {
								const div = document.createElement('div');
								div.style.cssText = 'background: #27272a; padding: 8px; border-radius: 6px;';
								div.innerHTML = `<span style="color: #34d399; font-weight: 500;">${r.relative_path}</span><div style="color: #a1a1aa; font-size: 11px; margin-top: 3px;">${(r.text || '').slice(0, 100)}...</div>`;
								testSearchResults.appendChild(div);
							});
						} catch (err) {}
					}, 250);
				});

				updateRAGUI();
				selectVault(window.__RAG_CONFIG__.selected_vault);
				topkSlider.value = String(window.__RAG_CONFIG__.top_k);
				topkVal.textContent = String(window.__RAG_CONFIG__.top_k);
				citationsToggle.checked = window.__RAG_CONFIG__.include_sources;

				loadVaultStats();
			})();
		</script>
	</body>
</html>
