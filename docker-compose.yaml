services:
  chroma:
    image: chromadb/chroma:latest
    container_name: sb-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: sb-gateway
    ports:
      - "8800:8800"
    volumes:
      - ./gateway-config.yaml:/app/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - ${SB_DOCS_DIR:-./docs}:/data/docs:ro
    environment:
      - CONFIG_PATH=/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - chroma
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sb-open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://gateway:8800/v1
      - OPENAI_API_KEY=none
      - ENABLE_OPENAI_API=True
      - ENABLE_OLLAMA_API=False
      - BYPASS_EMBEDDING_AND_RETRIEVAL=True
      - ENABLE_PERSISTENT_CONFIG=False
      - WEBUI_AUTH=False
      - TASK_MODEL_EXTERNAL=sleeping-beauty
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  chroma-data:
  open-webui-data:
